<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Yanibox</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="catalog.mjs"></script>
</head>
<body>
  <header class="top"><div class="wrap top-inner">
    <a class="brand" href="./"><span class="mark" aria-hidden="true"></span> Yanibox</a>
    <a class="nav-link" href="admin.html">Панель стримера ↗</a>
  </div></header>
  <main class="wrap">
    <nav class="site-tabs" aria-label="Разделы витрины">
      <a href="./" aria-current="page">Фильмы</a>
      <a href="watchtime.html">Время просмотра</a>
    </nav>
    <section class="hero">
      <div class="hero-content">
        <p class="eyebrow">Фильмы за баллы Twitch</p>
        <h1>Что смотрим<br><em>дальше?</em></h1>
        <p class="hero-description">Зрители предлагают фильмы за баллы канала. Здесь собраны очередь и оценки после просмотра.</p>
        <a class="button primary" href="#films">К списку фильмов ↓</a>
      </div>
      <div class="hero-art" aria-hidden="true"><div class="disc"><div></div></div></div>
    </section>
    <section id="films" class="library" aria-labelledby="list-title">
      <div class="section-head"><h2 id="list-title">Фильмы</h2><p id="summary" class="muted" aria-live="polite"></p></div>
      <div class="filters">
        <label class="visually-hidden" for="search">Поиск фильма</label>
        <input id="search" type="search" placeholder="Поиск по названию или зрителю">
        <label class="visually-hidden" for="category">Категория</label>
        <select id="category"><option value="">Все категории</option></select>
        <label class="visually-hidden" for="status">Статус</label>
        <select id="status"><option value="">Все статусы</option></select>
        <label class="visually-hidden" for="sort">Сортировка</label>
        <select id="sort"><option value="queue">По очереди</option><option value="rating">По оценке</option><option value="new">Сначала новые</option></select>
      </div>
      <p id="catalog-message" class="muted" role="status">Загружаем список…</p>
      <div id="cards" class="cards"></div>
    </section>
  </main>
</body>
</html>
