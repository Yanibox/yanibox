<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Заказы зрителей · Afterchat</title>
  <link rel="stylesheet" href="style.css?v=planning">
  <link rel="stylesheet" href="showcase.css?v=compact">
  <script type="module" src="catalog.mjs?v=compact"></script>
</head>
<body class="showcase">
  <header class="top"><div class="wrap top-inner">
    <a class="brand" href="./"><span class="mark" aria-hidden="true"></span> Afterchat</a>
    <a class="nav-link" href="admin.html">Панель стримера</a>
  </div></header>
  <main class="wrap">
    <nav class="site-tabs" aria-label="Разделы витрины">
      <a href="./">Главная</a>
      <a href="films.html" aria-current="page">Заказы зрителей</a>
      <a href="schedule.html">Расписание</a>
      <a href="watchtime.html">Время просмотра</a>
      <a href="profile.html">Профиль</a>
    </nav>
    <section id="films" class="library" aria-labelledby="list-title">
      <header class="library-header">
        <div>
          <h1 id="list-title">Заказы <em>зрителей</em></h1>
          <p class="muted">Очередь заказов и оценки после просмотра</p>
        </div>
        <p id="summary" class="muted" aria-live="polite"></p>
      </header>
      <div class="filters">
        <label class="visually-hidden" for="search">Поиск фильма</label>
        <input id="search" type="search" placeholder="Поиск по названию или зрителю">
        <label class="visually-hidden" for="category">Категория</label>
        <select id="category"><option value="">Все категории</option></select>
        <label class="visually-hidden" for="status">Статус</label>
        <select id="status"><option value="">Все статусы</option></select>
        <label class="visually-hidden" for="viewer">Зритель</label>
        <select id="viewer"><option value="">Все зрители</option></select>
        <label class="visually-hidden" for="sort">Сортировка</label>
        <select id="sort">
          <option value="queue">По очереди</option>
          <option value="old">Дата заказа: сначала старые</option>
          <option value="new">Дата заказа: сначала новые</option>
          <option value="planned">По дате плана</option>
          <option value="watched">По дате просмотра</option>
          <option value="rating">По оценке стримера</option>
        </select>
      </div>
      <div class="catalog-view">
        <button type="button" id="owner-toggle" class="quiet-button">Режим владельца</button>
        <label for="card-size">Размер карточек</label>
        <select id="card-size">
          <option value="compact" selected>Компактные</option>
          <option value="normal">Обычные</option>
          <option value="large">Крупные</option>
        </select>
      </div>
      <p id="catalog-message" class="muted" role="status">Загружаем список…</p>
      <div id="cards" class="cards"></div>
    </section>
  </main>
  <dialog id="vote-dialog" class="panel action-dialog" aria-labelledby="vote-title">
    <h2 id="vote-title"></h2>
    <form>
      <label>Твоя оценка<select name="score" required><option value="">Выбери от 1 до 10</option></select></label>
      <div class="form-line"><button type="submit" class="primary">Сохранить</button><button type="submit" formmethod="dialog" formnovalidate>Закрыть</button></div>
      <p class="hint" id="vote-message" role="status"></p>
    </form>
  </dialog>
  <dialog id="owner-dialog" class="panel action-dialog" aria-labelledby="owner-title">
    <h2 id="owner-title">Режим владельца</h2>
    <form id="owner-login">
      <label>Токен GitHub<input name="credential" type="password" autocomplete="off" required></label>
      <div class="form-line"><button type="submit" class="primary">Войти</button><button type="submit" formmethod="dialog" formnovalidate>Закрыть</button></div>
    </form>
    <form id="owner-editor" hidden>
      <label>Статус<select name="status"></select></label>
      <div id="owner-plan" class="owner-plan" hidden>
        <label>Дата показа<input name="plannedOn" type="date" min="1000-01-01" max="9999-12-31"></label>
        <label>Время показа (МСК)<input name="plannedTime" type="time"></label>
      </div>
      <label>Оценка стримера<input name="rating" type="number" min="0" max="10" step="0.1"></label>
      <div class="form-line"><button type="submit" class="primary">Опубликовать</button><button type="submit" formmethod="dialog" formnovalidate>Закрыть</button></div>
    </form>
    <p class="hint" id="owner-message" role="status"></p>
  </dialog>
</body>
</html>
