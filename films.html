<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Заказы зрителей · Yanibox</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="showcase.css">
  <script type="module" src="catalog.mjs"></script>
</head>
<body class="showcase">
  <header class="top"><div class="wrap top-inner">
    <a class="brand" href="./"><span class="mark" aria-hidden="true"></span> Yanibox</a>
    <a class="nav-link" href="admin.html">Панель стримера</a>
  </div></header>
  <main class="wrap">
    <nav class="site-tabs" aria-label="Разделы витрины">
      <a href="./">Главная</a>
      <a href="films.html" aria-current="page">Заказы зрителей</a>
      <a href="watchtime.html">Время просмотра</a>
    </nav>
    <section id="films" class="library" aria-labelledby="list-title">
      <header class="library-header">
        <div>
          <h1 id="list-title">Заказы <em>зрителей</em></h1>
          <p class="muted">Очередь заказов и оценки после просмотра</p>
        </div>
        <p id="summary" class="muted" aria-live="polite"></p>
      </header>
      <div class="filters">
        <label class="visually-hidden" for="search">Поиск фильма</label>
        <input id="search" type="search" placeholder="Поиск по названию или зрителю">
        <label class="visually-hidden" for="category">Категория</label>
        <select id="category"><option value="">Все категории</option></select>
        <label class="visually-hidden" for="status">Статус</label>
        <select id="status"><option value="">Все статусы</option></select>
        <label class="visually-hidden" for="viewer">Зритель</label>
        <select id="viewer"><option value="">Все зрители</option></select>
        <label class="visually-hidden" for="sort">Сортировка</label>
        <select id="sort">
          <option value="queue">По очереди</option>
          <option value="old">Дата заказа: сначала старые</option>
          <option value="new">Дата заказа: сначала новые</option>
          <option value="planned">По дате плана</option>
          <option value="watched">По дате просмотра</option>
          <option value="rating">По оценке</option>
        </select>
      </div>
      <p id="catalog-message" class="muted" role="status">Загружаем список…</p>
      <div id="cards" class="cards"></div>
    </section>
  </main>
</body>
</html>
