name: Publish Yanibox

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '13,43 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/build-pages.mjs
        env:
          MOVIE_CATALOG_CACHE_URL: https://yanibox.github.io/yanibox/data/movie-info.json
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deploy
