name: Publish Afterchat

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '13,43 * * * *'

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: watchtime-history
          path: .watchtime-history
      - uses: actions/configure-pages@v5
      - uses: actions/checkout@v5
        with:
          ref: twitch-game-history
          path: .twitch-game-history
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: node scripts/build-pages.mjs
        env:
          MOVIE_CATALOG_CACHE_URL: https://yanibox.github.io/yanibox/data/movie-info.json
          WATCHTIME_CACHE_URL: https://yanibox.github.io/yanibox/data/watchtime.json
          WATCHTIME_HISTORY_DIR: .watchtime-history
          TWITCH_GAME_HISTORY_DIR: .twitch-game-history
          SUPABASE_URL: ${{ vars.SUPABASE_RATINGS_ENABLED == 'true' && vars.SUPABASE_URL || '' }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_RATINGS_ENABLED == 'true' && vars.SUPABASE_PUBLISHABLE_KEY || '' }}
      - name: Save daily WizeBot snapshot
        working-directory: .watchtime-history
        run: |
          git add --all
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Archive daily WizeBot watch time'
          git push origin HEAD:watchtime-history
      - uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_attempt }}
          path: dist
      - name: Wait for the Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
        run: |
          for attempt in {1..10}; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$ARTIFACT_NAME" \
              --jq '.artifacts[] | select(.expired == false) | .id' | grep -q '[0-9]'; then
              exit 0
            fi
            sleep 4
          done
          echo "::error::GitHub has not made the Pages artifact available"
          exit 1
      - uses: actions/deploy-pages@v4
        id: deploy
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Sync watched films to Supabase
        if: vars.SUPABASE_URL != ''
        run: node scripts/sync-film-ratings.mjs
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          YANIBOX_RATINGS_SYNC_KEY: ${{ secrets.YANIBOX_RATINGS_SYNC_KEY }}
